<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗意留言 - 信封与羽毛笔 · GitHub Pages版</title>
    <style>
        :root {
            --parchment: #f5e6d0;
            --ink: #3a2f28;
            --gold: #b8955c;
            --gold-light: #d4b978;
            --red-wax: #8b1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8d5b8 0%, #f5e6d0 25%, #fdf5e6 50%, #f5e6d0 75%, #e8d5b8 100%);
            display: flex; justify-content: center; align-items: center;
            position: relative; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse at 20% 30%, rgba(139,119,80,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 75% 60%, rgba(139,119,80,0.06) 0%, transparent 55%);
        }
        .main-container {
            position: relative; z-index: 1; width: 90%; max-width: 750px; min-height: 550px;
            background: rgba(253,245,230,0.85); backdrop-filter: blur(8px);
            border-radius: 24px; padding: 40px 35px;
            box-shadow: 0 4px 30px rgba(58,47,40,0.2), inset 0 0 0 1px rgba(180,150,100,0.1);
            border: 2px solid rgba(180,149,92,0.25);
        }
        .page-view { display: none; }
        .page-view.active { display: block; }
        .homepage-content { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .envelope-wrapper {
            position: relative; width: 180px; height: 130px;
            animation: envelopeGentle 4s ease-in-out infinite;
            filter: drop-shadow(3px 6px 12px rgba(58,47,40,0.3));
        }
        @keyframes envelopeGentle {
            0%,100%{transform:translateY(0) rotate(0deg);}
            25%{transform:translateY(-6px) rotate(0.5deg);}
            75%{transform:translateY(-8px) rotate(0.4deg);}
        }
        .quill-wrapper {
            position: absolute; top: -55px; right: -30px;
            animation: quillWrite 5s ease-in-out infinite;
            filter: drop-shadow(2px 3px 4px rgba(58,47,40,0.35));
        }
        @keyframes quillWrite {
            0%,100%{transform:rotate(-12deg) translateX(0);}
            30%{transform:rotate(-18deg) translateX(8px);}
            60%{transform:rotate(-8deg) translateX(-4px);}
        }
        .btn {
            padding: 16px 36px; font-size: 1.1em; border: none; border-radius: 50px;
            cursor: pointer; letter-spacing: 0.05em; font-family: inherit;
            font-weight: bold; transition: all 0.35s; outline: none; min-width: 140px;
        }
        .btn-leave {
            background: linear-gradient(135deg, #8b5e3c, #6d3f1f); color: #fdf5e6;
            box-shadow: 0 6px 20px rgba(107,63,31,0.35); border: 2px solid rgba(180,149,92,0.4);
        }
        .btn-receive {
            background: linear-gradient(135deg, #7a9a7a, #4a6a4a); color: #fdf5e6;
            box-shadow: 0 6px 20px rgba(74,106,74,0.35); border: 2px solid rgba(180,149,92,0.4);
        }
        .btn:hover { transform: translateY(-4px); }
        .form-textarea {
            width: 100%; min-height: 160px; padding: 16px; border-radius: 16px;
            border: 2px solid rgba(180,149,92,0.35); background: rgba(255,252,245,0.7);
            font-family: inherit; font-size: 1em; resize: vertical;
        }
        .form-select, .form-input {
            padding: 12px 16px; border-radius: 30px; border: 2px solid rgba(180,149,92,0.35);
            background: rgba(255,252,245,0.7); font-family: inherit; font-size: 0.95em;
        }
        .room-id-box {
            background: rgba(139,26,26,0.08); border: 1px dashed var(--red-wax);
            padding: 15px; border-radius: 16px; margin: 15px 0; word-break: break-all;
        }
        .btn-copy {
            padding: 8px 18px; border-radius: 20px; background: var(--gold);
            border: none; color: white; cursor: pointer; font-family: inherit;
        }
        /* 省略部分辅助样式，完整视觉保留原设计 */
    </style>
</head>
<body>
<div class="main-container" id="app">
    <!-- ========== 主页 ========== -->
    <div class="page-view active" id="homePage">
        <div class="homepage-content">
            <div class="envelope-wrapper">
                <svg width="180" height="130" viewBox="0 0 180 130">
                    <rect x="10" y="28" width="160" height="92" rx="6" fill="#f5e6d0" stroke="#8b7355" stroke-width="2.5"/>
                    <polygon points="10,28 90,80 170,28" fill="#efe0cc" stroke="#8b7355" stroke-width="2.5"/>
                    <circle cx="90" cy="58" r="14" fill="#8b1a1a" stroke="#5a0000" stroke-width="2"/>
                </svg>
                <div class="quill-wrapper" style="width:60px; height:100px;">
                    <svg viewBox="0 0 60 120"><ellipse cx="35" cy="50" rx="20" ry="45" fill="#5d4037"/></svg>
                </div>
            </div>
            <h1>纸短情长 · 见字如面</h1>
            <div style="display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;">
                <button class="btn btn-leave" onclick="switchPage('leavePage')">✍ 留 言</button>
                <button class="btn btn-receive" onclick="switchPage('receivePage')">💌 接收留言</button>
            </div>
        </div>
    </div>

    <!-- ========== 留言页面 ========== -->
    <div class="page-view" id="leavePage">
        <button class="btn" onclick="switchPage('homePage')" style="margin-bottom:20px;">← 返回</button>
        <h2>✍ 书写留言</h2>
        <div style="display:flex; flex-direction:column; gap:15px; margin-top:10px;">
            <label>📝 留言内容</label>
            <div style="display:flex; gap:10px; align-items:center;">
                <select class="form-select" id="fontSelect" onchange="document.getElementById('messageContent').style.fontFamily=this.value">
                    <optgroup label="中文字体">
                        <option value="SimSun,serif">宋体</option>
                        <option value="SimHei,sans-serif">黑体</option>
                        <option value="KaiTi,serif">楷体</option>
                        <option value="Microsoft YaHei,sans-serif">微软雅黑</option>
                    </optgroup>
                    <optgroup label="英文字体">
                        <option value="Georgia,serif">Georgia</option>
                        <option value="Arial,sans-serif">Arial</option>
                        <option value="Courier New,monospace">Courier New</option>
                    </optgroup>
                </select>
            </div>
            <textarea class="form-textarea" id="messageContent" placeholder="在此写下你想说的话……" maxlength="2000"></textarea>
        </div>
        <div style="margin-top:15px;">
            <label>🎵 配乐选择</label>
            <select class="form-select" id="musicSelect">
                <option value="">-- 请选择配乐 --</option>
                <option value="wedding_march">婚礼进行曲</option>
                <option value="happy_birthday">生日快乐歌</option>
                <option value="funeral_march">葬礼进行曲</option>
                <option value="slow_guitar">慢调吉他</option>
                <option value="fast_rap">快调说唱</option>
                <option value="fresh_easy">清新随和</option>
            </select>
            <button class="btn" onclick="previewMusic()" id="previewBtn" style="margin-left:10px;">▶ 试听</button>
        </div>
        <div style="margin-top:15px;">
            <label>🌐 翻译工具</label>
            <div style="display:flex; gap:10px; align-items:center;">
                <select class="form-select" id="sourceLang"><option value="zh-CN">中文</option><option value="en">English</option></select>
                <span>→</span>
                <select class="form-select" id="targetLang"><option value="en">English</option><option value="zh-CN">中文</option></select>
                <button class="btn" onclick="translateContent()">翻译</button>
            </div>
        </div>
        <div style="margin-top:15px;">
            <label>🔒 设置密码（4位，字母+数字混合）</label>
            <div style="display:flex; gap:10px;">
                <input class="form-input" id="passwordInput" placeholder="例如：a1b2" maxlength="4" autocomplete="off">
                <input class="form-input" id="passwordConfirm" placeholder="确认密码" maxlength="4" autocomplete="off">
            </div>
            <span id="pwdError" style="color:#c0392b; font-size:0.85em;"></span>
        </div>
        <button class="btn btn-leave" onclick="saveMessage()" style="margin-top:20px;">💾 保存留言</button>
        <div id="roomInfo" style="margin-top:20px;"></div>
    </div>

    <!-- ========== 接收页面 ========== -->
    <div class="page-view" id="receivePage">
        <button class="btn" onclick="switchPage('homePage'); stopMusic();" style="margin-bottom:20px;">← 返回</button>
        <h2>💌 接收留言</h2>
        <div style="display:flex; flex-direction:column; gap:15px; margin-top:10px;">
            <div>
                <label>🔑 房间号（由发送者提供）</label>
                <input class="form-input" id="roomIdInput" placeholder="输入房间号" style="width:100%;">
            </div>
            <div>
                <label>🔒 留言密码</label>
                <input class="form-input" id="receivePassword" placeholder="输入4位密码" maxlength="4" style="width:100%;">
            </div>
            <button class="btn btn-receive" onclick="retrieveMessage()">🔍 查看留言</button>
            <div id="receiveResult" style="margin-top:20px;"></div>
            <div id="musicControl" style="display:none; text-align:center;">
                <span>🎵 <span id="nowPlaying"></span></span>
                <button class="btn" onclick="stopMusic()" style="margin-left:10px;">⏹ 停止</button>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== 云端存储（jsonblob） ====================
const BLOB_API = 'https://jsonblob.com/api/jsonBlob';

// 音乐系统（Web Audio API，保留完整功能）
let audioCtx = null, musicPlaying = false, musicType = null, timeoutIds = [];
function getAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function stopMusic() {
    timeoutIds.forEach(id=>clearTimeout(id));
    timeoutIds = []; musicPlaying = false; musicType = null;
    document.getElementById('musicControl').style.display = 'none';
}
function playNote(freq, start, dur, type='sine', gain=0.22) {
    const ctx = getAudioContext(); const now = ctx.currentTime + start;
    const osc = ctx.createOscillator(), gainNode = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(gain, now+0.02);
    gainNode.gain.linearRampToValueAtTime(0, now+dur);
    osc.connect(gainNode); gainNode.connect(ctx.destination);
    osc.start(now); osc.stop(now+dur+0.05);
}
function playMelody(notes, baseTime, loopCb) {
    let t = baseTime;
    notes.forEach(n => { playNote(n.freq, t, n.dur||0.3, n.type||'sine', n.gain||0.22); t += (n.dur||0.3)+(n.gap||0.05); });
    if (loopCb && musicPlaying) {
        const tid = setTimeout(()=>{ if(musicPlaying) loopCb(); }, t*1000);
        timeoutIds.push(tid);
    }
    return t;
}
function playMusicLoop(type) {
    if (!musicPlaying) return;
    const ctx = getAudioContext(); if (ctx.state==='suspended') ctx.resume();
    let dur = 0;
    if (type==='wedding_march') dur = playMelody([
        {freq:293.66,dur:0.35},{freq:392,dur:0.35},{freq:392,dur:0.3},{freq:392,dur:0.3},{freq:440,dur:0.4},{freq:493.88,dur:0.4},
        {freq:440,dur:0.5},{freq:392,dur:0.6,gap:0.3},{freq:392,dur:0.35},{freq:440,dur:0.35},{freq:392,dur:0.4},{freq:349.23,dur:0.5},{freq:329.63,dur:0.7,gap:0.4}
    ],0, ()=>playMusicLoop('wedding_march'));
    else if (type==='happy_birthday') dur = playMelody([
        {freq:261.63,dur:0.25},{freq:261.63,dur:0.2},{freq:293.66,dur:0.35},{freq:261.63,dur:0.35},{freq:349.23,dur:0.4},{freq:329.63,dur:0.5,gap:0.2},
        {freq:261.63,dur:0.25},{freq:261.63,dur:0.2},{freq:293.66,dur:0.35},{freq:261.63,dur:0.35},{freq:392,dur:0.4},{freq:349.23,dur:0.5,gap:0.2},
        {freq:261.63,dur:0.25},{freq:261.63,dur:0.2},{freq:523.25,dur:0.4},{freq:440,dur:0.35},{freq:349.23,dur:0.35},{freq:329.63,dur:0.35},{freq:293.66,dur:0.55,gap:0.35}
    ],0, ()=>playMusicLoop('happy_birthday'));
    else if (type==='funeral_march') dur = playMelody([
        {freq:174.61,dur:0.7},{freq:164.81,dur:0.6},{freq:146.83,dur:0.8},{freq:174.61,dur:0.7,gap:0.3},{freq:220,dur:0.6},{freq:196,dur:0.65},{freq:174.61,dur:0.9,gap:0.4}
    ],0, ()=>playMusicLoop('funeral_march'));
    else if (type==='slow_guitar') dur = playMelody([
        {freq:196,dur:0.5},{freq:246.94,dur:0.45},{freq:293.66,dur:0.5},{freq:392,dur:0.6,gap:0.3},{freq:329.63,dur:0.5},{freq:261.63,dur:0.45},{freq:220,dur:0.5},{freq:293.66,dur:0.6,gap:0.35}
    ],0, ()=>playMusicLoop('slow_guitar'));
    else if (type==='fast_rap') {
        const f=[220,277,329,370,440,370,329,277]; let notes=[];
        for(let i=0;i<16;i++) notes.push({freq:f[i%f.length],dur:0.15,gap:0.04,type:'sawtooth',gain:0.12});
        dur = playMelody(notes,0, ()=>playMusicLoop('fast_rap'));
    } else if (type==='fresh_easy') dur = playMelody([
        {freq:392,dur:0.4},{freq:440,dur:0.35},{freq:493.88,dur:0.4},{freq:523.25,dur:0.5,gap:0.25},{freq:493.88,dur:0.35},{freq:440,dur:0.4},{freq:392,dur:0.45},{freq:349.23,dur:0.5,gap:0.3}
    ],0, ()=>playMusicLoop('fresh_easy'));
    if (musicPlaying && dur) {
        const loopId = setTimeout(()=>{ if(musicPlaying&&musicType===type) playMusicLoop(type); }, dur*1000+200);
        timeoutIds.push(loopId);
    }
}
function startMusic(type) {
    musicPlaying = true; musicType = type;
    document.getElementById('musicControl').style.display = 'block';
    document.getElementById('nowPlaying').textContent = type;
    playMusicLoop(type);
}
function previewMusic() {
    const type = document.getElementById('musicSelect').value;
    if (!type) return alert('请选择配乐');
    stopMusic();
    document.getElementById('previewBtn').textContent = '⏹ 停止预览';
    startMusic(type);
}

// 翻译功能（MyMemory API）
async function translateContent() {
    const text = document.getElementById('messageContent').value.trim();
    if (!text) return alert('请输入留言内容');
    const from = document.getElementById('sourceLang').value;
    const to = document.getElementById('targetLang').value;
    try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
        const data = await res.json();
        if (data.responseData?.translatedText) {
            document.getElementById('messageContent').value = data.responseData.translatedText;
        } else alert('翻译失败');
    } catch(e) { alert('翻译服务不可用'); }
}

// 密码验证
function isValidPassword(pwd) { return /^(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z\d]{4}$/.test(pwd); }

// 保存留言
async function saveMessage() {
    const content = document.getElementById('messageContent').value.trim();
    const music = document.getElementById('musicSelect').value;
    const pwd = document.getElementById('passwordInput').value;
    const confirm = document.getElementById('passwordConfirm').value;
    const font = document.getElementById('fontSelect').value;
    const errEl = document.getElementById('pwdError');
    if (!content) return errEl.textContent='请填写留言内容';
    if (!music) return errEl.textContent='请选择配乐';
    if (!isValidPassword(pwd) || pwd !== confirm) return errEl.textContent='密码需4位且包含字母数字，两次一致';
    errEl.textContent = '';
    const payload = { content, music, password: pwd, font, timestamp: new Date().toISOString() };
    try {
        const res = await fetch(BLOB_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const location = res.headers.get('Location'); // /api/jsonBlob/xxxx-xxxx-xxxx
        const roomId = location.split('/').pop();
        document.getElementById('roomInfo').innerHTML = `
            <div class="room-id-box">
                ✅ 留言已保存！<br>
                🔑 房间号：<strong id="roomIdDisplay">${roomId}</strong>
                <button class="btn-copy" onclick="copyRoomId()">复制房间号</button><br>
                <span style="font-size:0.9em;">请将此房间号与密码告知接收者。</span>
            </div>`;
        // 清空表单
        ['messageContent','musicSelect','passwordInput','passwordConfirm'].forEach(id=>document.getElementById(id).value='');
        document.getElementById('previewBtn').textContent = '▶ 试听';
        stopMusic();
    } catch(e) { errEl.textContent='保存失败，请检查网络。'; }
}

function copyRoomId() {
    const id = document.getElementById('roomIdDisplay').textContent;
    navigator.clipboard.writeText(id).then(()=>alert('房间号已复制'));
}

// 接收留言
async function retrieveMessage() {
    stopMusic();
    const roomId = document.getElementById('roomIdInput').value.trim();
    const pwd = document.getElementById('receivePassword').value.trim();
    const resultDiv = document.getElementById('receiveResult');
    if (!roomId || !pwd) return resultDiv.innerHTML='请输入房间号和密码';
    try {
        const res = await fetch(`${BLOB_API}/${roomId}`);
        if (!res.ok) throw new Error('房间不存在');
        const data = await res.json();
        if (data.password !== pwd) return resultDiv.innerHTML='<p style="color:#c0392b;">密码错误</p>';
        resultDiv.innerHTML = `
            <div style="background:rgba(255,252,245,0.8); border-radius:16px; padding:20px; border:2px solid rgba(180,149,92,0.35);">
                <div style="font-family:${data.font||'serif'}; white-space:pre-wrap; font-size:1.1em;">${escapeHtml(data.content)}</div>
                <p style="margin-top:15px; color:#5c4a3a;">🎵 ${data.music} | ${new Date(data.timestamp).toLocaleString()}</p>
            </div>`;
        startMusic(data.music);
    } catch(e) { resultDiv.innerHTML='<p style="color:#c0392b;">房间号无效或留言不存在</p>'; }
}

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

// 页面切换
function switchPage(pageId) {
    document.querySelectorAll('.page-view').forEach(p=>p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (pageId==='leavePage') {
        document.getElementById('pwdError').textContent='';
        document.getElementById('roomInfo').innerHTML='';
    }
    if (pageId==='receivePage') {
        document.getElementById('receiveResult').innerHTML='';
        stopMusic();
    }
}
</script>
</body>
</html>
